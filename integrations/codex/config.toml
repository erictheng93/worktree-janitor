# worktree-janitor hooks for OpenAI Codex CLI, inline config.toml form.
#
# Manual setup: replace /path/to/worktree-janitor with the absolute
# path of your checkout (forward slashes also work on Windows), then append
# everything from the ">>>" line on to $CODEX_HOME/config.toml (default
# ~/.codex/config.toml). Start Codex and trust the hooks (startup prompt or
# /hooks); untrusted hooks never run.
#
# Use ONE representation per config layer: Codex merges hooks.json with
# inline [hooks] tables but warns at every session start when both exist. If
# you already keep hooks in ~/.codex/hooks.json, use hooks.json next to this
# file instead. `node scripts/install.mjs --codex` does all of this for you.

# >>> worktree-janitor >>>
# Added by worktree-janitor. Remove with: node "/path/to/worktree-janitor/scripts/install.mjs" --codex --uninstall
[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "node \"/path/to/worktree-janitor/scripts/janitor.mjs\" --hook session-start"
timeout = 30

[[hooks.PostToolUse]]
matcher = "Bash"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "node \"/path/to/worktree-janitor/scripts/janitor.mjs\" --hook post-tool-use"
timeout = 30
# <<< worktree-janitor <<<
