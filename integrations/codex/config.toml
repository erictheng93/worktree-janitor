# worktree-janitor hooks for OpenAI Codex CLI, inline config.toml form.
#
# Manual setup: replace /path/to/worktree-janitor with the absolute
# path of your checkout (forward slashes also work on Windows), then append
# everything from the ">>>" line on to $CODEX_HOME/config.toml (default
# ~/.codex/config.toml). Start Codex and trust the hooks (startup prompt or
# /hooks); untrusted hooks never run.
#
# `command` runs on macOS/Linux, `command_windows` on Windows (PowerShell).
# Neither needs node on PATH, which desktop apps often lack: they try node on
# PATH, then the usual install locations (Homebrew, Volta, fnm; Program
# Files on Windows) and exit 0 quietly when there is none. The installer also
# puts the absolute path of the node it ran with first.
#
# Use ONE representation per config layer: Codex merges hooks.json with
# inline [hooks] tables but warns at every session start when both exist. If
# you already keep hooks in ~/.codex/hooks.json, use hooks.json next to this
# file instead. `node scripts/install.mjs --codex` does all of this for you.

# >>> worktree-janitor >>>
# Added by worktree-janitor. Remove with: node "/path/to/worktree-janitor/scripts/install.mjs" --codex --uninstall
[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "for n in \"$(command -v node 2>/dev/null)\" /opt/homebrew/bin/node /usr/local/bin/node \"$HOME/.volta/bin/node\" \"$HOME/.local/share/fnm/aliases/default/bin/node\" \"$HOME/Library/Application Support/fnm/aliases/default/bin/node\"; do if [ -f \"$n\" ] && [ -x \"$n\" ]; then exec \"$n\" \"/path/to/worktree-janitor/scripts/janitor.mjs\" --hook session-start; fi; done; exit 0"
command_windows = "$n = @((Get-Command node.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source), (Join-Path $env:ProgramFiles 'nodejs\\node.exe')) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1; if ($n) { & $n '/path/to/worktree-janitor/scripts/janitor.mjs' --hook session-start; exit $LASTEXITCODE }; exit 0"
timeout = 30

[[hooks.PostToolUse]]
matcher = "Bash"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "for n in \"$(command -v node 2>/dev/null)\" /opt/homebrew/bin/node /usr/local/bin/node \"$HOME/.volta/bin/node\" \"$HOME/.local/share/fnm/aliases/default/bin/node\" \"$HOME/Library/Application Support/fnm/aliases/default/bin/node\"; do if [ -f \"$n\" ] && [ -x \"$n\" ]; then exec \"$n\" \"/path/to/worktree-janitor/scripts/janitor.mjs\" --hook post-tool-use; fi; done; exit 0"
command_windows = "$n = @((Get-Command node.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source), (Join-Path $env:ProgramFiles 'nodejs\\node.exe')) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1; if ($n) { & $n '/path/to/worktree-janitor/scripts/janitor.mjs' --hook post-tool-use; exit $LASTEXITCODE }; exit 0"
timeout = 30
# <<< worktree-janitor <<<
