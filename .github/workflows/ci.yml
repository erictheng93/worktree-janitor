name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      # The mount tests self-detect what they need and must run on ubuntu
      # (root or passwordless sudo for `mount`) and macOS (`hdiutil attach`).
      - run: npm test
        env:
          JANITOR_REQUIRE_MOUNT_TESTS: ${{ matrix.os != 'windows-latest' && '1' || '' }}

  bun:
    name: bun / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: bun scripts/janitor.mjs --help
      - name: Test suite (node test runner, janitor executed by bun)
        run: npm test
        env:
          JANITOR_RUNTIME: bun
          JANITOR_REQUIRE_MOUNT_TESTS: '1'
