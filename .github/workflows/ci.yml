name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung disk tool must fail the job, not hold a runner for six hours.
    # windows-11-arm gets more: one node 20 run there took 26 minutes (the
    # diskpart/VHDX steps were ~4x slower than on another arm64 runner).
    timeout-minutes: ${{ matrix.os == 'windows-11-arm' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit images instead of *-latest, so the OS under test is known:
        #   windows-2022    Server 2022, build 20348 (Windows 10 21H2 kernel), x64
        #   windows-2025    Server 2025, build 26100 (Windows 11 24H2 kernel), x64
        #   windows-11-arm  Windows 11 client, arm64
        #   macos-15 / macos-26  arm64 (Apple silicon); macos-15-intel  x64
        # (macos-13 and macos-14 are no longer offered by GitHub.)
        os: [ubuntu-latest, macos-15, macos-26, macos-15-intel, windows-2022, windows-2025, windows-11-arm]
        node: [18, 20, 22]
        exclude:
          # setup-node has no Node 18 build for win32-arm64 ("Unable to find
          # Node version '18' for platform win32 and architecture arm64").
          - os: windows-11-arm
            node: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Git identity
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Environment (for the record)
        shell: bash
        run: |
          node -p '`node ${process.version} ${process.platform} ${process.arch} (os.release ${require("os").release()})`'
          git --version
          case "$RUNNER_OS" in
            Windows) powershell -NoProfile -Command '[Environment]::OSVersion.VersionString; $v = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"; "$($v.ProductName) $($v.DisplayVersion) build $($v.CurrentBuild).$($v.UBR) $env:PROCESSOR_ARCHITECTURE"' ;;
            macOS) sw_vers; uname -m ;;
            Linux) uname -a; . /etc/os-release && echo "$PRETTY_NAME" ;;
          esac
      # The mount tests self-detect what they need and must run everywhere:
      # ubuntu (root or passwordless sudo for `mount`), macOS (`hdiutil
      # attach`, HFS+ and APFS images) and Windows (elevated runner: a VHDX
      # mounted on a directory with diskpart).
      - run: npm test
        env:
          JANITOR_REQUIRE_MOUNT_TESTS: '1'

  # JSDoc types checked by tsc (devDependencies only; the test jobs above
  # never install them, so the runtime stays dependency-free).
  typecheck:
    name: typecheck / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run typecheck

  bun:
    name: bun / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: bun scripts/janitor.mjs --help
      - name: Test suite (node test runner, janitor executed by bun)
        run: npm test
        env:
          JANITOR_RUNTIME: bun
          JANITOR_REQUIRE_MOUNT_TESTS: '1'
